name: Cron Heartbeat Watchdog

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      force_stale_test:
        description: 'Force the heartbeat monitor to treat the run as stale'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  check-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check cron heartbeat freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_HEARTBEAT_WEBHOOK_URL: ${{ secrets.CRON_HEARTBEAT_WEBHOOK_URL }}
          FORCE_STALE_TEST: ${{ github.event.inputs.force_stale_test || 'false' }}
        run: |
          python -m backend.heartbeat_monitor
