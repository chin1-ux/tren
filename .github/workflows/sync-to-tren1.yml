name: Sync to Dedicated Scraper Repo (chin1-ux/tren)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to chin1-ux/tren
        env:
          SCRAPER_REPO_TOKEN: ${{ secrets.SCRAPER_REPO_TOKEN }}
        run: |
          if [ -n "$SCRAPER_REPO_TOKEN" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add target https://x-access-token:${SCRAPER_REPO_TOKEN}@github.com/chin1-ux/tren.git || true
            git fetch target main
            git push target main --force

          else
            echo "SCRAPER_REPO_TOKEN not configured; skipping sync."
          fi
