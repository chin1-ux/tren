name: Pending Trends Monitor

on:
  schedule:
    # EMERGENCY POSTURE: 3x/day (was 6x) — revert to 4h post-Sept 1 reset
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pending trends monitoring
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_CONNECT_TIMEOUT: 30
          SUPABASE_READ_TIMEOUT: 60
        run: |
          python backend/pending_trends_monitor.py