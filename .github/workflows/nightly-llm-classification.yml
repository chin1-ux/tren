name: LLM Classification Batch

on:
  schedule:
    # EMERGENCY POSTURE: 2x/day (was 4x) — revert to 4x post-Sept 1 reset
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: llm-classification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-llm-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly LLM batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          NIGHTLY_LLM_BASE_DELAY_SECONDS: 5.0
          NIGHTLY_LLM_MAX_CALLS_PER_RUN: 50
          SUPABASE_CONNECT_TIMEOUT: 30
          SUPABASE_READ_TIMEOUT: 60
        run: |
          python backend/nightly_llm_batch.py