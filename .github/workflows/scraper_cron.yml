name: Trendrop Scheduled Scraper Pipeline Cron

on:
  schedule:
    - cron: '0 */3 * * *'  # Trigger every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
  workflow_dispatch:        # Manual trigger button in GitHub UI

concurrency:
  group: scraper-cron
  cancel-in-progress: false

jobs:
  scrape_and_detect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.11'

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright "camoufox[geoip]"
          playwright install chromium
          python -m camoufox fetch

      - name: Check Early Exit Guard
        id: guard
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_GUARD_MIN_GAP_MINUTES: ${{ vars.SCRAPER_GUARD_MIN_GAP_MINUTES }}
        run: |
          python scripts/check_scraper_guard.py

      - name: Run Full Scraper & Detection Pipeline
        id: pipeline
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 55
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STEP_TIMEOUT_SECONDS: "2580"
        run: |
          python backend/cron_job.py

      - name: Recompute Active Stages
        if: steps.guard.outputs.skip != 'true' && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backend/stage_tag_engine.py

      - name: Finalize & Record Cron Run
        if: always() && steps.guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          STEP_CONCLUSION: ${{ steps.pipeline.outcome }}
        run: |
          python scripts/finalize_cron_run.py
