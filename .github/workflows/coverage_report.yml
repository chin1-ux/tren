name: Weekly Coverage Report

on:
  schedule:
    - cron: '17 3 * * 1'  # Weekly on Monday at 03:17 UTC (off-minute)
  workflow_dispatch:

concurrency:
  group: scraper-main
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv supabase camoufox playwright requests
          python -m camoufox fetch || true

      - name: Run Coverage Report
        continue-on-error: false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
        run: |
          python backend/diagnose_miss.py --coverage
