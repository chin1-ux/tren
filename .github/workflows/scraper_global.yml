name: Trendrop Scraper — Global Cluster

# Schedule design for Global virality peaks (UTC times):
#  Slot 1 — 12:45 UTC (18:15 IST) — Asia evening / Europe midday
#  Slot 2 — 18:45 UTC (00:15 IST) — Europe evening / Americas afternoon peak
#  Slot 3 — 00:45 UTC (06:15 IST) — Americas Prime Time & Latin / Phonk late night

on:
  schedule:
    - cron: '45 12 * * *'
    - cron: '45 18 * * *'
    - cron: '45 0 * * *'

  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass guard and force execution'
        required: false
        default: 'false'

concurrency:
  group: scraper-pipeline
  cancel-in-progress: false

jobs:
  scrape_global:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Camoufox browser binaries
        uses: actions/cache@v4
        id: camoufox-cache
        with:
          path: ~/.camoufox
          key: camoufox-v2-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            camoufox-v2-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright "camoufox[geoip]"
          playwright install chromium
          python -m camoufox sync || true
          for i in 1 2 3; do
            python -m camoufox fetch && break || (echo "camoufox fetch retry $i in 10s..." && sleep 10)
          done
          python -m camoufox version

      - name: Check scraper guard (90-min gap)
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_GUARD_MIN_GAP_MINUTES: "90"
          SCRAPER_GUARD_WORKFLOW_NAME: "scraper_global.yml"
        run: |
          if [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            echo "Force run requested: bypassing guard."
          else
            python scripts/check_scraper_guard.py
          fi

      - name: Run Global Scraper & Detection Pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCRAPER_MODE: "global"
        run: |
          echo "=== Scraper Mode: $SCRAPER_MODE (Dedicated Global Cluster) ==="
          python backend/cron_job.py
