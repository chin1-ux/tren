<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trendrop Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a3f);
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    h1 { margin-bottom: 1rem; font-size: 2.5rem; }
    p { margin: 0.5rem 0; }
    a { color: #90cdf4; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Trendrop</h1>
    <p>This is a placeholder dashboard.</p>
    <p>Visit the <a href="/api/health">API health endpoint</a> to check the backend.</p>
  </div>
</body>
</html>
