services:
  - type: web
    name: trendrop-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python database_setup.py && uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DEMO_ALLOWLIST
        sync: false
      - key: CRON_HEARTBEAT_WEBHOOK_URL
        sync: false
      - key: CRON_HEARTBEAT_ALERT_EMAIL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_MOCK_MODE
        value: "true"

  # RQ background worker — consumes reel-generation jobs from Upstash Redis.
  # Without this, every enqueued job hangs in "processing" forever.
  - type: worker
    name: trendrop-rq-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker_runner.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DEMO_ALLOWLIST
        sync: false
      - key: CRON_HEARTBEAT_WEBHOOK_URL
        sync: false
      - key: CRON_HEARTBEAT_ALERT_EMAIL
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_MOCK_MODE
        value: "true"


