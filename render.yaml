services:
  - type: web
    name: trendrop-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python database_setup.py && uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # RQ background worker — consumes reel-generation jobs from Upstash Redis.
  # Without this, every enqueued job hangs in "processing" forever.
  - type: worker
    name: trendrop-rq-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker_runner.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Cron job — scrapes trends, refreshes lifecycle, sends Resend alert emails.
  # Runs every 6 hours. Uses schedule loop; needs a persistent process.
  - type: cron
    name: trendrop-pipeline-cron
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 */6 * * *"
    startCommand: python cron_job.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
